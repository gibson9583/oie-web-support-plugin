# Builds both Web Support installation choices from one tag:
#   websupport-VERSION.zip             APIs only (catalog default)
#   websupport-web-client-VERSION.zip  APIs + OIE-hosted web client
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ENGINE_REPOSITORY: OpenIntegrationEngine/engine
      WEB_CLIENT_REPOSITORY: gibson9583/oie-web-client
      WEB_CLIENT_REF: ${{ vars.WEB_CLIENT_REF }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Web Support
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve and verify versions
        id: versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r .version oie.json)"
          PLUGIN_VERSION="$(sed -n 's:.*<pluginVersion>\(.*\)</pluginVersion>.*:\1:p' plugin.xml)"
          WC_MANIFEST_VERSION="$(jq -r .version oie.web-client.json)"
          WC_PLUGIN_VERSION="$(sed -n 's:.*<pluginVersion>\(.*\)</pluginVersion>.*:\1:p' web-client-plugin.xml)"
          if [ "$VERSION" != "$MANIFEST_VERSION" ] || [ "$VERSION" != "$PLUGIN_VERSION" ] \
             || [ "$VERSION" != "$WC_MANIFEST_VERSION" ] || [ "$VERSION" != "$WC_PLUGIN_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must match oie.json (${MANIFEST_VERSION}), plugin.xml (${PLUGIN_VERSION}), oie.web-client.json (${WC_MANIFEST_VERSION}), and web-client-plugin.xml (${WC_PLUGIN_VERSION})"
            exit 1
          fi
          ENGINE_VERSION="$(jq -r .minEngineVersion oie.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "engine-version=$ENGINE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download the OIE compile-time distribution
        run: |
          ENGINE_VERSION="${{ steps.versions.outputs.engine-version }}"
          ENGINE_ASSET="oie_unix_${ENGINE_VERSION//./_}.tar.gz"
          mkdir -p engine-dist engine-home
          gh release download "v${ENGINE_VERSION}" -R "$ENGINE_REPOSITORY" -p "$ENGINE_ASSET" -D engine-dist
          tar -xzf "engine-dist/$ENGINE_ASSET" -C engine-home
          SERVER_LIB="$(find engine-home -type d -name server-lib -print -quit)"
          if [ -z "$SERVER_LIB" ]; then
            echo "::error::The OIE distribution contains no server-lib directory"
            exit 1
          fi
          echo "OIE_HOME=${SERVER_LIB%/server-lib}" >> "$GITHUB_ENV"

      - name: Resolve the web client ref (pinned for reproducible bundles)
        run: |
          REF="${WEB_CLIENT_REF}"
          if [ -z "$REF" ] && [ -f web-client.ref ]; then
            REF="$(grep -vE '^[[:space:]]*(#|$)' web-client.ref | head -n1 | tr -d '[:space:]')"
          fi
          if [ -z "$REF" ]; then
            echo "::error::No web client ref pinned. Set the WEB_CLIENT_REF repository variable or commit a web-client.ref (a web-client tag or full commit SHA)."
            exit 1
          fi
          echo "WEB_CLIENT_REF=$REF" >> "$GITHUB_ENV"
          echo "Bundling OIE web client @ $REF"

      - name: Checkout web client
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WEB_CLIENT_REPOSITORY }}
          ref: ${{ env.WEB_CLIENT_REF }}
          path: oie-web-client

      - name: Build web-client WAR
        working-directory: oie-web-client
        run: |
          npm ci
          npm run build:war
          echo "WEB_CLIENT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build both Web Support packages
        run: |
          mvn -B -ntp package \
            -Dwebclient.war="$GITHUB_WORKSPACE/oie-web-client/web-administrator/dist/oie-web-client.war"

      - name: Validate and stage release assets
        id: assets
        run: |
          VERSION="${{ steps.versions.outputs.version }}"
          API="target/websupport-${VERSION}.zip"
          BUNDLE="target/websupport-web-client-${VERSION}.zip"
          test -f "$API"
          test -f "$BUNDLE"
          # The APIs package is Web Support only — never the WAR-hosting extension.
          if unzip -Z1 "$API" | grep -qE 'oie-web-client\.war$|^oie-webadmin/'; then
            echo "::error::Web Support (APIs) package unexpectedly contains the web client"
            exit 1
          fi
          unzip -Z1 "$API" | grep -qx 'websupport/plugin.xml'
          # The client package is the standalone oie-webadmin extension carrying the WAR.
          unzip -Z1 "$BUNDLE" | grep -qx 'oie-webadmin/plugin.xml'
          unzip -Z1 "$BUNDLE" | grep -qx 'oie-webadmin/webclient-deploy.jar'
          unzip -Z1 "$BUNDLE" | grep -qx 'oie-webadmin/oie-web-client.war'
          unzip -p "$BUNDLE" oie-webadmin/oie-web-client.war > bundled.war
          jar --list --file bundled.war | grep -qx 'index.jsp'
          jar --list --file bundled.war | grep -qx 'WEB-INF/web.xml'
          mkdir -p out
          cp "$API" "$BUNDLE" out/
          (cd out && sha256sum *.zip > SHA256SUMS)
          echo "api=$(basename "$API")" >> "$GITHUB_OUTPUT"
          echo "bundle=$(basename "$BUNDLE")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/${{ steps.assets.outputs.api }}
            out/${{ steps.assets.outputs.bundle }}
            out/SHA256SUMS
          body: |
            Two independent extensions are attached — install either or both:

            - `${{ steps.assets.outputs.api }}` — **Web Support** (id `websupport`): engine-side REST APIs for the web administrator (message trees, JavaScript validation, plugin-UI serving).
            - `${{ steps.assets.outputs.bundle }}` — **OIE Web Client** (id `oie-webadmin`): deploys the browser administrator into this engine's Jetty, served at `/oie-web-client/`.

            OIE Web Client bundles web-client source `${{ env.WEB_CLIENT_REPOSITORY }}@${{ env.WEB_CLIENT_COMMIT }}`.
          prerelease: ${{ contains(github.ref_name, '-') }}

  catalog-manifest:
    needs: release
    uses: ./.github/workflows/catalog-pr.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
