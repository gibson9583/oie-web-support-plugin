name: Validate Web Support
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify package, descriptor, Maven and release-tag versions
        run: |
          python3 - <<'PYTHON'
          import json, os, xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          version = ET.parse('pom.xml').findtext('m:version', namespaces=ns)
          assert version == ET.parse('plugin.xml').findtext('pluginVersion')
          assert version == json.load(open('oie.json'))['version']
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          print('Validated Web Support', version)
          PYTHON
      - name: Obtain pinned OIE 4.6.0 compile inputs
        run: |
          curl -fL --retry 3 -o oie.tar.gz https://github.com/OpenIntegrationEngine/engine/releases/download/v4.6.0/oie_unix_4_6_0.tar.gz
          echo '7c82e79027e671277e1d78d0f7bbb1c53ddf1be476f1e80c2ddbfcf7855900ea  oie.tar.gz' | sha256sum -c -
          mkdir engine-inputs
          tar -xzf oie.tar.gz -C engine-inputs \
            oie/server-lib/mirth-server.jar oie/server-lib/mirth-client-core.jar \
            oie/server-lib/donkey/donkey-model.jar
      - name: Test bundled WAR installation and removal
        run: mvn -B -ntp test -Doie.home="$GITHUB_WORKSPACE/engine-inputs/oie"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: java-contract-results
          path: target/surefire-reports/
