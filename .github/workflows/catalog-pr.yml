# Auto-files version manifests to the community catalog when a release is
# published. Each release contains one Web Support extension with both the APIs
# and embedded web administrator. The workflow seeds the package's meta.json the
# first time it enters the catalog, then only adds version manifests thereafter.
#
# The tag release calls this as a reusable workflow because a release created by
# GITHUB_TOKEN does not trigger `on: release`. That event remains for releases
# published manually.
#
# Requires the CATALOG_TOKEN secret: a fine-grained PAT with Contents and
# Pull requests read/write on the catalog repository.
name: Catalog PR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to file (e.g. v1.0.1) — for backfilling"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Release tag whose artifacts should enter the catalog"
        required: true
        type: string
    secrets:
      CATALOG_TOKEN:
        required: true

jobs:
  catalog-manifest:
    runs-on: ubuntu-latest
    env:
      CATALOG_REPO: gibson9583/oie-community-catalog
      GH_TOKEN: ${{ secrets.CATALOG_TOKEN }}
    steps:
      - name: Require the catalog token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CATALOG_TOKEN secret is not set — cannot open the catalog PR. Add a fine-grained PAT with Contents+Pull requests access to $CATALOG_REPO."
            exit 1
          fi

      - name: Resolve tag and version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Download and digest the release asset
        run: |
          # Public asset URL, no auth: CATALOG_TOKEN is scoped to the catalog repo
          # and fine-grained PATs can 404 on API reads outside their grant.
          curl -fL --retry 5 --retry-delay 5 -o asset.zip \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/websupport-${VERSION}.zip"
          echo "SHA256=$(sha256sum asset.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Read package metadata from the tagged manifest
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/$TAG/oie.json" -o metafile.json
          echo "MIN_ENGINE=$(node -p "JSON.parse(require('fs').readFileSync('metafile.json','utf8')).minEngineVersion")" >> "$GITHUB_ENV"
          # Empty when the tagged manifest has no ui field (older tags).
          echo "UI=$(node -p "const ui = JSON.parse(require('fs').readFileSync('metafile.json','utf8')).ui; ui === undefined ? '' : JSON.stringify(ui)")" >> "$GITHUB_ENV"
          echo "STORE_DOCS=$(node -p "JSON.parse(require('fs').readFileSync('metafile.json','utf8')).storeDocs || 'docs/store.md'")" >> "$GITHUB_ENV"
          # Project the catalog meta.json now and stash it, so it survives the
          # catalog checkout below. Only written when the package has no meta.json yet.
          node -e "const m=JSON.parse(require('fs').readFileSync('metafile.json','utf8')); const pick=(o,ks)=>Object.fromEntries(ks.filter(k=>o[k]!==undefined).map(k=>[k,o[k]])); process.stdout.write(JSON.stringify(pick(m,['id','name','description','type','publisher','repository','homepage','documentation','license','authors','keywords','deprecated']),null,4));" > meta.generated.json
          {
            echo 'META_JSON<<__META_EOF__'
            cat meta.generated.json
            echo ''
            echo '__META_EOF__'
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: gibson9583/oie-community-catalog
          token: ${{ secrets.CATALOG_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write the manifests
        run: |
          DIR="manifests/plugins/websupport"
          mkdir -p "$DIR"
          # Seed stable metadata the first time this package enters the catalog.
          # (catalog CI rejects a package that has meta.json but no version manifest,
          # so the two must land together — which this step guarantees.)
          if [ ! -f "$DIR/meta.json" ]; then
            printf '%s\n' "$META_JSON" > "$DIR/meta.json"
          fi
          # "ui" is included only when the tagged manifest declares it.
          UI_LINE=""
          if [ -n "$UI" ]; then
            UI_LINE=$'\n'"    \"ui\": ${UI},"
          fi
          cat > "$DIR/${VERSION}.json" <<EOF
          {
              "version": "${VERSION}",${UI_LINE}
              "minEngineVersion": "${MIN_ENGINE}",
              "maxEngineVersion": null,
              "installerUrl": "https://github.com/${{ github.repository }}/releases/download/${TAG}/websupport-${VERSION}.zip",
              "sha256": "${SHA256}",
              "restartRequired": true,
              "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "releaseNotesUrl": "https://github.com/${{ github.repository }}/releases/tag/${TAG}",
              "docsUrl": "https://raw.githubusercontent.com/${{ github.repository }}/${TAG}/${STORE_DOCS}"
          }
          EOF

      - name: Validate (schema + digest download)
        run: node scripts/build-index.mjs --lint --verify "manifests/plugins/websupport/${VERSION}.json"

      - name: Open the catalog PR
        run: |
          BRANCH="websupport-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add manifests
          git commit -m "websupport ${VERSION}"
          git push -f origin "$BRANCH"
          if gh pr list -R "$CATALOG_REPO" --head "$BRANCH" --json number -q '.[0].number' | grep -q .; then
            echo "PR already open for $BRANCH — branch updated."
          else
            gh pr create -R "$CATALOG_REPO" --head "$BRANCH" \
              --title "websupport ${VERSION}" \
              --body "Automated manifest for [websupport ${TAG}](https://github.com/${{ github.repository }}/releases/tag/${TAG}). Digest computed from the release asset by this workflow and verified again by catalog CI."
          fi
